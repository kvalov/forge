[project]
name = "forge"
version = "0.1.0"
description = "Forge AI Software Engineer"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.139.0",
    "gitpython>=3.1.50",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "typer>=0.26.8",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[project.scripts]
forge = "forge.cli.main:main"
